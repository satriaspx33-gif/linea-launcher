name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Perbaiki file gradle
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Linea"
          include(":app")
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          echo "=== isi akar"; ls -la
          echo "=== isi app"; ls -la app
          echo "=== root build.gradle.kts"; cat build.gradle.kts
          test -f app/build.gradle.kts || { echo "FILE app/build.gradle.kts TIDAK ADA"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "AndroidManifest.xml TIDAK ADA"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: linea-apk
          path: app/build/outputs/apk/debug/app-debug.apk
